<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1eaea2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17918a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1eaea2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17918a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#126b66;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bottom book (horizontal) -->
  <rect x="5" y="19" width="22" height="9" rx="1.5" 
        fill="url(#book1)"/>
  <rect x="7" y="21" width="18" height="1" 
        fill="#ffffff" 
        opacity="0.3" 
        rx="0.5"/>
  
  <!-- Middle book (tilted left) -->
  <g transform="rotate(-12 16 16)">
    <rect x="7" y="11" width="18" height="7" rx="1.5" 
          fill="url(#book2)"/>
    <rect x="9" y="13" width="14" height="1" 
          fill="#ffffff" 
          opacity="0.3" 
          rx="0.5"/>
  </g>
  
  <!-- Top book (tilted right) -->
  <g transform="rotate(10 16 16)">
    <rect x="9" y="4" width="16" height="6" rx="1.5" 
          fill="url(#book3)"/>
    <rect x="11" y="6" width="12" height="1" 
          fill="#ffffff" 
          opacity="0.3" 
          rx="0.5"/>
  </g>
</svg>
